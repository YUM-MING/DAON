# DAON 통합 서버 설정
# 실행: run.bat                  (이 파일 사용, 폰 카메라·마이크)
#       run.bat --tunnel         (+ Cloudflare 터널로 https 공개 주소 — 폰·보호자가 밖에서 접속)
#       run.bat --mock           (센서 모듈 없이 가짜 이벤트로 UI/대화 테스트)

server:
  host: 0.0.0.0
  port: 8000

modules:
  vision:
    mode: worker       # worker | mock | off
    source: phone      # phone(로봇 폰 카메라, 기본) | 0 (PC 웹캠 인덱스) | 영상 파일 경로
    fps: 10            # 폰이 보내는 프레임 상한 (서버 처리 부하 조절)
    debug: true        # 판정 근거(속도·종횡비·각도·표정 raw/conf)를 대시보드 '실시간 센서 로그'로 + 낙상 순간 스냅샷 logs/home_N/
    record: true       # 폰 카메라 프레임을 logs/home_N/cam_*.mp4 로 녹화 (2분 단위, 최근 15개 보관) → 낙상 임계값 재보정·오탐 분석
  audio:
    mode: worker       # worker | mock | off
    source: phone      # phone(로봇 폰 마이크, 기본) | mic (PC 마이크)
    input_device: null # PC 마이크일 때 sounddevice 장치 번호
    stt_model: base    # tiny / base / small
    stt: true
    debug: true        # 0.5초마다 소리 분류 결과(대화/낙상/소음, P(fall))를 대시보드로
    record: true       # 폰 마이크 소리를 logs/home_N/mic_*.wav 로 저장 (2분 단위, 약 30분 보관) → 정연 모듈로 재현 가능
  radar:
    mode: "off"        # worker | mock | off  — 레이더가 꽂힌 PC 만 config.local.yaml 에서 worker 로 (off 는 따옴표 필수)
    port: COM3         # 장치 관리자 > 포트(COM & LPT) 에서 USB-TTL(CP2102) 번호 확인. CP210x 드라이버 필요
                       # 점검: python server/workers/radar_worker.py --port COM3 --monitor  (설정 읽기는 --info)
    baud: 256000
    home_code: null    # 이 PC 레이더가 어느 집 센서인지 (null = 첫 번째 집)
  dialogue:
    mode: real         # real | off

robot:
  sleep_after_absent_sec: 30
  tts_timeout_sec: 12
  wake_to_listen_sec: 2

# 리포트 탭 '대화 요약'의 AI 요약. 보호자가 [AI 요약 보기]를 누를 때만 LLM 을 부른다.
# LLM 제공자·모델·API 키는 modules/dialogue/.env (DIALOGUE_LLM, DIALOGUE_LLM_MODEL, *_API_KEY) 를 그대로 쓴다.
summary:
  max_messages: 200      # 하루치에서 참고할 최대 대화 수 (넘으면 오래된 것부터 버림)
  max_chars: 6000        # LLM 에 보내는 최대 글자 수 (넘으면 오래된 것부터 버림)
  min_messages: 4        # 이보다 적으면 요약하지 않음 (LLM 호출 안 함)
  robot_text_chars: 40   # 로봇 발화는 앞 N자만 사용 (토큰 절약)
  daily_limit: 20        # 집당 하루 LLM 호출 상한
  cooldown_sec: 300      # 같은 날짜를 다시 요약하기까지 최소 대기 (그동안은 저장된 요약을 보여줌)
  timeout_sec: 20        # LLM 응답 대기 제한
  max_tokens: 800        # 요약 출력 길이 상한

logs:
  dir: logs
  eval_log: eval_log.jsonl     # logs/<집코드>/eval_log.jsonl
  alerts: alerts.jsonl
  scenario_id: live
  db: daon.db                  # 계정·집·알림 기록 (SQLite)

# 시연용 개발자 계정 (서버 시작 시 자동 생성). 로그인하면 바로 '데모 집'에 연결되고 개발자 도구가 켜진다.
